name: hulu_coffee_pos
description: "A fresh modern POS application for Hulu Coffee."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.3.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  sqflite_common_ffi: ^2.3.4
  sqflite_common_ffi_web: ^0.4.5+4
  sqlite3_flutter_libs: ^0.5.42
  image_picker: ^0.8.9
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  sqlite3: '>=2.0.0 <3.0.0'
  sqflite_common_ffi: 2.3.4+4
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
