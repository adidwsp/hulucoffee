<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hulu Coffee - Customize</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#d5e3ff",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#dec29f",
                        "on-tertiary-fixed": "#2d1604",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1a1c1d",
                        "primary-container": "#1a4b84",
                        "secondary": "#705b3e",
                        "on-tertiary-fixed-variant": "#5f402a",
                        "surface-container-highest": "#e2e2e4",
                        "background": "#f9f9fb",
                        "on-primary-container": "#93bcfc",
                        "secondary-fixed": "#fbdeb9",
                        "on-tertiary-container": "#ddb195",
                        "inverse-surface": "#2f3132",
                        "outline": "#737781",
                        "surface-dim": "#d9dadc",
                        "tertiary-fixed-dim": "#eabda0",
                        "surface-container": "#eeeef0",
                        "surface-tint": "#335f99",
                        "on-background": "#1a1c1d",
                        "surface-bright": "#f9f9fb",
                        "surface": "#f9f9fb",
                        "surface-container-high": "#e8e8ea",
                        "on-secondary-fixed-variant": "#564428",
                        "on-surface-variant": "#424750",
                        "on-primary-fixed": "#001c3b",
                        "secondary-container": "#fbdeb9",
                        "on-primary-fixed-variant": "#144780",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e2e2e4",
                        "primary-fixed-dim": "#a6c8ff",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f3f3f5",
                        "on-secondary-fixed": "#271903",
                        "primary": "#003466",
                        "tertiary": "#492d19",
                        "inverse-on-surface": "#f0f0f2",
                        "on-secondary-container": "#766143",
                        "tertiary-container": "#63432d",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c3c6d1",
                        "on-error": "#ffffff",
                        "inverse-primary": "#a6c8ff",
                        "tertiary-fixed": "#ffdcc6"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
        .glass-panel { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Top Navigation (Shell suppressed based on task, this is a focused customization flow, but we need a header to close) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-white/80 backdrop-blur-xl shadow-sm shadow-blue-900/5 transition-transform duration-200">
<button aria-label="Back" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-1 text-center">
<h1 class="font-headline font-bold text-lg tracking-tight text-primary">Customize Drink</h1>
</div>
<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 pt-24 pb-32 px-6 md:px-12 max-w-3xl mx-auto w-full">
<!-- Hero Product Info -->
<section class="flex items-center gap-6 mb-10 bg-surface-container-lowest p-4 rounded-xl shadow-[0_8px_32px_rgba(26,75,132,0.06)]">
<div class="w-24 h-24 rounded-lg overflow-hidden shrink-0 bg-surface-container">
<img alt="Iced Caramel Macchiato" class="w-full h-full object-cover" data-alt="A premium iced caramel macchiato in a clear plastic cup with intricate caramel drizzle on top, condensation on the glass, bright studio lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA3PPcdOAVlB0IGNmRUo8pmDkM9DvI20Yqsal_d19YGOfhsT3DNJjXsGZjCN5-2rwUJFezU2GvBjeSMy_tsMVGxeWXquZucsAA7yWOV79bgT2v530ok3tDFPNUukhZu8jBa1Fi9O4_YA1Y3Gidgq1hiopW9Ns0NhIoHEP--D2qhDM1_yp8GOkAhQutZ3biepNSz1-8kV6FG0P-kNQiDAOVeeRptDK2HiE7qG8SetayTt96ASHOY0T7djBfgdixGkAqdxwITZ8RlcM0D"/>
</div>
<div class="flex-1">
<h2 class="font-headline font-bold text-2xl text-on-surface mb-1">Iced Caramel Macchiato</h2>
<p class="text-on-surface-variant font-body text-sm mb-2">Rich espresso, vanilla syrup, milk, and ice, topped with caramel drizzle.</p>
<div class="font-headline font-black text-xl text-primary">Rp 85.000</div>
</div>
</section>
<form class="space-y-10">
<!-- Size Section -->
<section>
<div class="flex justify-between items-baseline mb-4">
<h3 class="font-headline font-bold text-lg text-on-surface">Size</h3>
<span class="text-primary font-label text-xs uppercase tracking-wide font-semibold">Rp 85.000</span>
</div>
<div class="grid grid-cols-3 gap-4">
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="size" type="radio" value="S"/>
<div class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-lowest text-on-surface-variant transition-all border border-outline-variant/15 peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed peer-checked:border-transparent peer-active:scale-95 group-hover:shadow-[0_4px_16px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-3xl mb-2 filled-icon">local_cafe</span>
<span class="font-label text-sm font-semibold">Small</span>
<span class="text-xs mt-1 opacity-70">12 oz</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="size" type="radio" value="M"/>
<div class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-lowest text-on-surface-variant transition-all border border-outline-variant/15 peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed peer-checked:border-transparent peer-active:scale-95 shadow-[0_4px_16px_rgba(26,75,132,0.04)]">
<span class="material-symbols-outlined text-4xl mb-2 filled-icon">local_cafe</span>
<span class="font-label text-sm font-semibold">Medium</span>
<span class="text-xs mt-1 opacity-70">16 oz</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="size" type="radio" value="L"/>
<div class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-lowest text-on-surface-variant transition-all border border-outline-variant/15 peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed peer-checked:border-transparent peer-active:scale-95 group-hover:shadow-[0_4px_16px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-5xl mb-2 filled-icon">local_cafe</span>
<span class="font-label text-sm font-semibold">Large</span>
<span class="text-xs mt-1 opacity-70">20 oz</span>
</div>
</label>
</div>
</section>
<!-- Temperature Section -->
<section class="bg-surface-container-low p-6 rounded-xl">
<div class="flex justify-between items-baseline mb-4">
<h3 class="font-headline font-bold text-lg text-on-surface">Temperature</h3>
<span class="text-primary font-label text-xs uppercase tracking-wide font-semibold">Required</span>
</div>
<div class="flex gap-4">
<label class="flex-1 relative cursor-pointer">
<input class="peer sr-only" name="temp" type="radio" value="Hot"/>
<div class="flex items-center justify-center gap-2 p-4 rounded-xl bg-surface-container-lowest text-on-surface-variant transition-all border border-outline-variant/15 peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-transparent active:scale-95">
<span class="material-symbols-outlined">local_fire_department</span>
<span class="font-label font-semibold">Hot</span>
</div>
</label>
<label class="flex-1 relative cursor-pointer">
<input checked="" class="peer sr-only" name="temp" type="radio" value="Ice"/>
<div class="flex items-center justify-center gap-2 p-4 rounded-xl bg-surface-container-lowest text-on-surface-variant transition-all border border-outline-variant/15 peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed peer-checked:border-transparent active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-primary">ac_unit</span>
<span class="font-label font-semibold">Iced</span>
</div>
</label>
</div>
</section>
<!-- Sugar Level -->
<section>
<div class="flex justify-between items-baseline mb-4">
<h3 class="font-headline font-bold text-lg text-on-surface">Sugar Level</h3>
</div>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input class="peer sr-only" name="sugar" type="radio" value="0"/>
<span class="inline-flex items-center justify-center px-5 py-3 rounded-xl bg-surface-container-lowest text-on-surface-variant font-label font-medium transition-all border border-outline-variant/15 peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-transparent active:scale-95">0%</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="sugar" type="radio" value="25"/>
<span class="inline-flex items-center justify-center px-5 py-3 rounded-xl bg-surface-container-lowest text-on-surface-variant font-label font-medium transition-all border border-outline-variant/15 peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-transparent active:scale-95">25%</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="sugar" type="radio" value="50"/>
<span class="inline-flex items-center justify-center px-5 py-3 rounded-xl bg-surface-container-lowest text-on-surface-variant font-label font-medium transition-all border border-outline-variant/15 peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-transparent active:scale-95">50%</span>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="sugar" type="radio" value="100"/>
<span class="inline-flex items-center justify-center px-5 py-3 rounded-xl bg-surface-container-lowest text-on-surface-variant font-label font-medium transition-all border border-outline-variant/15 peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-transparent active:scale-95">100% (Normal)</span>
</label>
</div>
</section>
<!-- Add-ons (Bento Grid Style) -->
<section>
<div class="flex justify-between items-baseline mb-4">
<h3 class="font-headline font-bold text-lg text-on-surface">Add-ons</h3>
<span class="text-on-surface-variant font-label text-sm">Optional</span>
</div>
<div class="grid grid-cols-2 gap-4">
<label class="relative cursor-pointer group col-span-2 sm:col-span-1">
<input class="peer sr-only" name="addon" type="checkbox" value="extra_shot"/>
<div class="flex items-center justify-between p-4 rounded-xl bg-surface-container-lowest text-on-surface transition-all border border-outline-variant/15 peer-checked:bg-primary-fixed peer-checked:border-transparent active:scale-95">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary peer-checked:text-primary">coffee_maker</span>
<div>
<div class="font-label font-semibold">Extra Espresso Shot</div>
<div class="text-sm text-on-surface-variant">+Rp 15.000</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
</label>
<label class="relative cursor-pointer group col-span-2 sm:col-span-1">
<input class="peer sr-only" name="addon" type="checkbox" value="oat_milk"/>
<div class="flex items-center justify-between p-4 rounded-xl bg-surface-container-lowest text-on-surface transition-all border border-outline-variant/15 peer-checked:bg-primary-fixed peer-checked:border-transparent active:scale-95">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary peer-checked:text-primary">water_drop</span>
<div>
<div class="font-label font-semibold">Oat Milk</div>
<div class="text-sm text-on-surface-variant">+Rp 10.000</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
</label>
<label class="relative cursor-pointer group col-span-2">
<input class="peer sr-only" name="addon" type="checkbox" value="whipped_cream"/>
<div class="flex items-center justify-between p-4 rounded-xl bg-surface-container-lowest text-on-surface transition-all border border-outline-variant/15 peer-checked:bg-primary-fixed peer-checked:border-transparent active:scale-95">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary peer-checked:text-primary">icecream</span>
<div>
<div class="font-label font-semibold">Whipped Cream</div>
<div class="text-sm text-on-surface-variant">Free</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
</label>
</div>
</section>
<!-- Special Notes -->
<section>
<div class="flex justify-between items-baseline mb-2">
<label class="font-headline font-bold text-lg text-on-surface" for="notes">Special Notes</label>
</div>
<textarea class="w-full bg-surface-variant text-on-surface border-transparent focus:border-transparent focus:ring-0 rounded-xl p-4 font-body text-sm transition-colors focus:bg-primary-fixed focus:text-on-primary-fixed placeholder:text-on-surface-variant/60 resize-none" id="notes" name="notes" placeholder="Any special requests for the barista?" rows="3"></textarea>
</section>
</form>
</main>
<!-- Floating Action Bar / Cart Summary -->
<div class="fixed bottom-0 left-0 w-full z-50 p-6 glass-panel bg-surface-container-lowest/80 border-t border-outline-variant/10 shadow-[0_-8px_32px_rgba(26,75,132,0.08)]">
<div class="max-w-3xl mx-auto flex items-center justify-between gap-6">
<div class="flex flex-col">
<span class="text-on-surface-variant text-sm font-label">Total Estimate</span>
<span class="font-headline font-black text-2xl text-primary">Rp 85.000</span>
</div>
<button class="flex-1 bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-xl py-4 px-8 font-headline font-bold text-lg shadow-[0_8px_24px_rgba(26,75,132,0.2)] hover:shadow-[0_12px_32px_rgba(26,75,132,0.3)] active:scale-98 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined">add_shopping_cart</span>
                Add to Cart
            </button>
</div>
</div>
</body></html>
