<body class="bg-surface font-body antialiased h-screen w-full relative overflow-hidden flex flex-col items-center justify-center selection:bg-primary-container selection:text-on-primary-container">
<!-- Subtle Background Pattern -->
<div class="absolute inset-0 z-0 bg-gradient-to-b from-surface-bright to-surface-container-low"></div>
<img alt="" class="absolute inset-0 w-full h-full object-cover opacity-[0.03] pointer-events-none mix-blend-multiply grayscale" data-alt="abstract minimalist overhead shot of scattered coffee beans creating a subtle uniform texture, low contrast, elegant premium feel, soft lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCPoBFzv9K6aKE2TAcL4Dw_yEJW1ok2zxgFYjOZ8o53guS5i27RXXU7p9XleYgmWUnKGoID62PhDffw9xkGRlblM6YaV7PMQzFDCHAUOSEiuWfmRXy88rEsOTo65qoyOvBFK-pbvrN4fDPgK8zqbcY_Xm2W7G83YqCIjWmVp5dF3yaBXG8QmQklj-mqN19m9EBzdm4rER7vghwxwE7tVvd-0Ik2NTjTym6bDsEDgEDC6gl4WgY1kEpCWJSyl0G3Dtb7dDoZJ7VULPI1"/>
<!-- Central Brand Cluster -->
<div class="relative z-10 flex flex-col items-center">
<!-- Ambient Glow for Depth -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-primary/5 rounded-full blur-[64px] pointer-events-none"></div>
<!-- Logo Mark (Finance/Minimalist Style) -->
<div class="relative w-24 h-24 mb-8 flex items-center justify-center">
<!-- Ghost Outline -->
<div class="absolute inset-0 border-[2px] border-primary/10 rounded-full"></div>
<!-- Geometric Core (Merging banking security shape with organic coffee bean curve) -->
<div class="w-12 h-12 bg-gradient-to-br from-primary to-primary-container rounded-tl-full rounded-br-full rounded-tr-md rounded-bl-md rotate-[-45deg] shadow-[0_12px_32px_rgba(0,52,102,0.2)] flex items-center justify-center">
<!-- Inner precision line -->
<div class="w-0.5 h-6 bg-white/40 rounded-full rotate-45"></div>
</div>
</div>
<!-- Typography Cluster -->
<div class="flex flex-col items-center text-center">
<h1 class="font-headline text-6xl font-black text-primary tracking-tighter mb-1.5 leading-none">
                Hulu
            </h1>
<h2 class="font-headline text-2xl font-bold text-primary-container tracking-[0.1em] uppercase leading-none">
                Coffee
            </h2>
<!-- System Status Tag -->
<div class="mt-6 px-3 py-1 bg-surface-container-lowest border border-outline-variant/30 rounded-md shadow-sm shadow-on-surface/5">
<p class="font-label text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest">
                    Point of Sale
                </p>
</div>
</div>
<!-- Fast Loading Indicator area -->
<div class="mt-16 flex flex-col items-center gap-4">
<!-- Progress Line -->
<div class="w-40 h-1.5 rounded-full bg-surface-variant overflow-hidden">
<div class="w-2/5 h-full rounded-full bg-gradient-to-r from-primary-container to-primary shadow-[0_0_8px_rgba(0,52,102,0.4)]"></div>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant/70">sync</span>
<p class="font-label text-xs font-medium text-on-surface-variant/70 tracking-widest uppercase">
                    Syncing Workspace
                </p>
</div>
</div>
</div>
<!-- Security Badge Bottom -->
<div class="absolute bottom-8 left-0 w-full flex justify-center z-10 pointer-events-none">
<div class="flex items-center gap-1.5 opacity-40">
<span class="material-symbols-outlined text-[12px] text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-label text-[10px] font-medium text-on-surface-variant tracking-wider uppercase">Encrypted Connection</p>
</div>
</div>
